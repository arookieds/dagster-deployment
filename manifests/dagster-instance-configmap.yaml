apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-instance
  namespace: dagster

data:
  dagster.yaml: |-
    storage:
      postgres:
        postgres_db:
          username:
            env: DAGSTER_PG_USERNAME
          password:
            env: DAGSTER_PG_PASSWORD
          host: postgresql.database.svc.cluster.local
          port: 5432
          db_name: dagster
